seed: 0

data:
  source_path: /kaggle/working/RecRL/data/yambda-500m-flat/multi_event.parquet
  prepared_dir: /kaggle/input/datasets/ivanpanferov/recrl-yambda-500m-prepared

  download:
    dataset_size: 500m
    event: multi_event
    output_dir: /kaggle/working/RecRL/data/yambda-500m-flat
    users_fraction: 1.0
    seed: 42

preprocessing:
  context_length: 128
  min_sequence_length: 10
  max_items: 100000
  batch_size: 262144
  train_fraction: 0.8
  validation_fraction: 0.1
  train_cutoff: null
  validation_cutoff: null

model:
  context_length: 128
  hidden_size: 512
  layers: 8
  heads: 8
  feed_forward_size: 2048
  dropout: 0.1

training:
  # torchrun --nproc_per_node=2 main.py
  # effective_batch_size = batch_size * gradient_accumulation_steps * 2
  batch_size: 32
  gradient_accumulation_steps: 4
  effective_batch_size: 256
  epochs: 1
  learning_rate: 0.0006
  betas: [0.9, 0.95]
  weight_decay: 0.01
  max_grad_norm: 1.0
  warmup_ratio: 0.03
  mixed_precision: fp16
  num_workers: 0
  drop_last: true
  log_every_steps: 25
  eval_every_steps: 1000
  checkpoint_every_steps: 5000
  output_dir: /kaggle/working/RecRL/model/gpt2-next-item-500m-30m
  checkpoint_dir: /kaggle/working/RecRL/checkpoints-gpt2-500m-30m
  resume_from: auto

evaluation:
  batch_size: 256
  k_values: [5, 10, 15, 20]
  metrics_file: /kaggle/working/RecRL/eval/gpt2-500m-30m-metrics.jsonl
  training_loss_file: /kaggle/working/RecRL/eval/gpt2-500m-30m-training-loss.jsonl
  plots_dir: /kaggle/working/RecRL/eval/gpt2-500m-30m-plots
  plot_k: 20

